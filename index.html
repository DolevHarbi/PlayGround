<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Starfall Wilds</title>
<style>
:html,body{margin:0;height:100%;overflow:hidden;background:#09152e;font-family:Inter,ui-sans-serif,system-ui;color:#fff}
#game{display:block;width:100vw;height:100vh;background:#14284d;image-rendering:auto}
.hud{position:absolute;pointer-events:none}.card{background:rgba(9,18,42,.78);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(3,8,28,.35);backdrop-filter:blur(8px);border-radius:14px}
#topLeft{left:18px;top:18px;width:300px;padding:12px}.portrait{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#6ed8ff,#725fe7);border:2px solid #d8f3ff;display:inline-grid;place-items:center;font-size:28px;vertical-align:middle}.identity{display:inline-block;vertical-align:middle;margin-left:9px}.name{font-weight:900;font-size:14px}.level{font-size:11px;color:#9fe4ff;margin-top:2px}.bars{margin-top:8px}.bar{height:9px;border-radius:8px;background:#321e42;margin:3px 0;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}.hp i{width:100%;background:linear-gradient(90deg,#ff6975,#ffae66)}.mp i{width:100%;background:linear-gradient(90deg,#56caff,#7b72ff)}.xp i{width:62%;background:linear-gradient(90deg,#d9bc69,#fff18a)}
#quest{right:18px;top:18px;width:260px;padding:14px}.questTitle{font-size:11px;color:#9fe4ff;text-transform:uppercase;letter-spacing:2px;font-weight:800}.questName{font-size:15px;font-weight:900;margin:7px 0 8px}.questText{font-size:12px;color:#bac8df}.questTrack{float:right;color:#ffde7a;font-weight:800}
#hotbar{left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px}.slot{width:58px;height:58px;position:relative;display:grid;place-items:center;border-radius:12px;background:rgba(11,25,55,.9);border:1px solid rgba(180,215,255,.18);box-shadow:inset 0 0 14px rgba(91,155,230,.06)}.slot .key{position:absolute;left:6px;top:4px;font-size:9px;color:#9cb6d7}.slot .icon{font-size:27px;filter:drop-shadow(0 3px 3px #061024)}.slot.cool{filter:saturate(.45);opacity:.72}.slot.selected{border-color:#fff19a;box-shadow:0 0 18px rgba(255,221,99,.28)}
#boss{left:50%;top:20px;transform:translateX(-50%);width:min(460px,45vw);text-align:center}.bossName{font-size:12px;font-weight:900;text-shadow:0 2px 4px #000}.bossBar{height:10px;margin-top:5px;border-radius:8px;background:#471b46;border:1px solid rgba(255,255,255,.12);overflow:hidden}.bossBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4d70,#ffc56e)}
#prompt{left:50%;bottom:92px;transform:translateX(-50%);font-size:11px;color:#d7e6ff;text-align:center;text-shadow:0 2px 5px #000}
#toast{left:50%;top:82px;transform:translateX(-50%);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:800;color:#bff8d2;display:none}
#controls{left:18px;bottom:18px;font-size:10px;color:#a7bad7;line-height:1.7}.controlsKey{display:inline-block;padding:1px 6px;margin:1px;border:1px solid #71829f;border-radius:4px;background:rgba(10,20,44,.8);color:#fff}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="topLeft" class="hud card"><span class="portrait">🧝</span><span class="identity"><div class="name">LUMA <span style="color:#7df0bf">✦</span></div><div class="level">WANDERER · LV. 12</div></span><div class="bars"><div class="bar hp"><i id="hpbar"></i></div><div class="bar mp"><i></i></div><div class="bar xp"><i></i></div></div></div>
<div id="boss" class="hud"><div class="bossName">GROVEGUARD · ANCIENT OF THORN</div><div class="bossBar"><i id="bossbar"></i></div></div>
<div id="quest" class="hud card"><div class="questTitle">Active Quest <span class="questTrack">◆ 1.2 km</span></div><div class="questName">Whispers in the Wildwood</div><div class="questText">Gather moonshrooms <b style="color:#dfff7a">3/5</b><br/>Defeat the Groveguard</div></div>
<div id="prompt" class="hud">Moonshroom Grove · <span style="color:#87eeb7">REST</span></div>
<div id="toast" class="hud card"></div>
<div id="hotbar" class="hud"><div class="slot selected"><span class="key">1</span><span class="icon">⚔️</span></div><div class="slot"><span class="key">2</span><span class="icon">🌪️</span></div><div class="slot"><span class="key">3</span><span class="icon">🏹</span></div><div class="slot"><span class="key">4</span><span class="icon">⚡</span></div><div class="slot"><span class="key">Q</span><span class="icon">🧪</span></div><div class="slot"><span class="key">E</span><span class="icon">🛠️</span></div></div>
<div id="controls" class="hud"><span class="controlsKey">A D</span> Move &nbsp; <span class="controlsKey">SPACE</span> Jump &nbsp; <span class="controlsKey">J</span> Attack &nbsp; <span class="controlsKey">K</span> Ability &nbsp; <span class="controlsKey">B</span> Build</div>
<script src="game.js"></script>
</body></html>
